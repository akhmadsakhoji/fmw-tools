name: Release

# Push a tag like v0.1.0 to publish binaries for Linux, macOS and Windows.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./... && go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Create the release.
      id-token: write     # Sign the build provenance.
      attestations: write # Store it (check with: gh attestation verify <file> -R akhmadsakhoji/fmw-tools).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        run: ./scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/fmw-tools_*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "FMW Tools $GITHUB_REF_NAME" --generate-notes --verify-tag
